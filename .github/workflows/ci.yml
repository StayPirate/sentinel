name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Dockerfile and pyproject.toml Python version match .python-version
        run: |
          set -euo pipefail
          EXPECTED=$(cat .python-version)
          if ! [[ "$EXPECTED" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.python-version=$EXPECTED is not a valid minor-only version (expected format X.Y, e.g. 3.13 — see docs/conventions.md, Runtime Version)"
            exit 1
          fi
          ACTUAL_DOCKERFILE=$(grep -oP '(?<=ARG PYTHON_VERSION=)\S+' Dockerfile)
          if [ "$EXPECTED" != "$ACTUAL_DOCKERFILE" ]; then
            echo "::error::Dockerfile ARG PYTHON_VERSION=$ACTUAL_DOCKERFILE does not match .python-version=$EXPECTED"
            exit 1
          fi
          ACTUAL_REQUIRES_PYTHON=$(grep -oP '(?<=requires-python = ">=)\S+(?=")' pyproject.toml)
          if [ "$EXPECTED" != "$ACTUAL_REQUIRES_PYTHON" ]; then
            echo "::error::pyproject.toml requires-python=>=$ACTUAL_REQUIRES_PYTHON does not match .python-version=$EXPECTED"
            exit 1
          fi
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.mypy_cache
          key: mypy-${{ hashFiles('backend/uv.lock') }}
          restore-keys: mypy-
      - run: uv run mypy app tests alembic

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel_test
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      TEST_REDIS_URL: redis://localhost:6379/2
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production-min-32-chars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=95
      - name: Run local process system suite
        # Separate, blocking invocation from the coverage-measured run
        # above — spawns real worker/Beat processes against this job's
        # same PostgreSQL/Redis service containers. See
        # docs/features/platform/testing-strategy.md (Local Process
        # System Testing, CI Pipeline).
        run: uv run pytest -m system tests/system/ -v
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Check Alembic migration drift
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Verify OpenAPI schema generation
        run: uv run python scripts/generate_openapi.py > /dev/null

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Run bandit (static analysis)
        run: uvx bandit@1.9.4 -c pyproject.toml -r app/
      - name: Run pip-audit (dependency vulnerabilities)
        run: uvx pip-audit@2.10.1 --requirement <(uv export --no-hashes --no-dev --no-emit-project)

  shell-lint:
    name: Shell Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: "0.11.0"
      SHFMT_VERSION: "3.13.1"
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned shell tooling
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/shell-tools"
          mkdir -p "${tools_dir}"

          # Install shellcheck (tar.xz; binary at shellcheck-v<ver>/shellcheck)
          curl -fsSL -o "${tools_dir}/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf "${tools_dir}/shellcheck.tar.xz" -C "${tools_dir}"
          mv "${tools_dir}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${tools_dir}/shellcheck"

          # Install shfmt (single static binary)
          curl -fsSL -o "${tools_dir}/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"

          # Install actionlint (tar.gz containing the actionlint binary)
          curl -fsSL -o "${tools_dir}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf "${tools_dir}/actionlint.tar.gz" -C "${tools_dir}" actionlint

          chmod +x "${tools_dir}/shellcheck" "${tools_dir}/shfmt" "${tools_dir}/actionlint"
          echo "${tools_dir}" >>"${GITHUB_PATH}"
      - name: Verify pinned tool versions
        run: |
          set -euo pipefail
          shellcheck --version
          shfmt --version
          actionlint --version
      - name: Run shellcheck + shfmt on shell scripts and hooks
        run: |
          set -euo pipefail
          # Discover tracked shell files dynamically so newly added scripts
          # and hooks are covered automatically (no static list to maintain).
          # Mirrors the in-scope definition used by .githooks/pre-commit:
          #   '*.sh'        -> every tracked .sh file anywhere in the repo
          #   '.githooks/*' -> extension-less bash hooks
          # git ls-files respects .gitignore (never picks up .venv/, etc.).
          # NUL-safe read + sort -zu de-duplicates (patterns are disjoint in
          # practice, but be safe).
          mapfile -d '' -t shell_files < <(
            git ls-files -z '*.sh' '.githooks/*' | sort -z -u
          )
          if [[ ${#shell_files[@]} -eq 0 ]]; then
            echo "No tracked shell files found; nothing to lint."
            exit 0
          fi
          printf 'Linting %d shell file(s):\n' "${#shell_files[@]}"
          printf '  %s\n' "${shell_files[@]}"
          shellcheck "${shell_files[@]}"
          shfmt -i 4 -ci -d "${shell_files[@]}"
      - name: Run actionlint (workflows)
        run: |
          set -euo pipefail
          actionlint

  image-smoke:
    name: Image Smoke Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SMOKE_IMAGE: sentinel-backend:smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Read Python version from .python-version
        id: python-version
        run: echo "version=$(cat backend/.python-version)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build backend image (load only, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          build-args: PYTHON_VERSION=${{ steps.python-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image smoke test (blocking gate)
        id: image-smoke
        env:
          SENTINEL_IMAGE: ${{ env.SMOKE_IMAGE }}
        run: ./scripts/image-smoke.sh --no-build
      - name: Generate and validate release SBOM candidate
        env:
          IMAGE_NAME: ${{ github.repository }}
          TESTED_IMAGE: ${{ steps.image-smoke.outputs.image_id }}
        run: >-
          ./scripts/sbom-gate.sh
          "${TESTED_IMAGE}"
          "${RUNNER_TEMP}/sentinel-pr.sbom.cdx.json"
          "ghcr.io/${IMAGE_NAME,,}"
          "${GITHUB_SHA}"
      - name: Upload release SBOM candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-sbom-candidate
          path: ${{ runner.temp }}/sentinel-pr.sbom.cdx.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
