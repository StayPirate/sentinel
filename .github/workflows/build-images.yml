name: Build Docker Images

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

# Top-level permissions are fully restrictive by default (principle of
# least privilege — see docs/deployment.md, Least-privilege permissions).
# The job below declares the specific read/write scopes it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  SMOKE_IMAGE: sentinel-backend:smoke
  IMAGE_NAME: ${{ github.repository }}
  OPENAPI_ARTIFACT_NAME: sentinel-openapi-${{ github.run_id }}

jobs:
  build-backend:
    name: Build Backend Image
    # workflow_run.branches matches the *head* branch of the triggering CI
    # run, not the base branch it targeted — a CI run produced by a
    # pull_request event whose head branch happens to be named "master"
    # (e.g. a fork's default branch) would otherwise pass the filter. The
    # explicit event == 'push' check ensures this job only builds and
    # publishes a commit that actually landed on master via push, never a
    # commit that only exists on a pull request head. See issue #96.
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      image-name: ${{ steps.push.outputs.image_name }}
      image-digest: ${{ steps.push.outputs.digest }}
      sbom-artifact-name: ${{ steps.sbom-metadata.outputs.artifact_name }}
      sbom-file-name: ${{ steps.sbom-metadata.outputs.file_name }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Read Python version from .python-version
        id: python-version
        run: echo "version=$(cat backend/.python-version)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build the image ONCE into the local Docker daemon (push: false,
      # load: true). This is the single build invocation; the smoke gate
      # tests this exact artifact and the push step below re-tags and
      # publishes the very same local image (identical digest).
      - name: Build backend image (load only, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PYTHON_VERSION=${{ steps.python-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      # Blocking smoke gate: brings up the full stack against the loaded
      # image, runs the `image`-marked pytest suite, tears down. A failure
      # here fails the job (fail-fast, no continue-on-error) and prevents
      # any push below.
      - name: Image smoke test (blocking gate)
        id: image-smoke
        env:
          SENTINEL_IMAGE: ${{ env.SMOKE_IMAGE }}
        run: ./scripts/image-smoke.sh --no-build

      - name: Select SBOM metadata
        id: sbom-metadata
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: ./scripts/select-sbom-metadata.sh

      - name: Generate and validate release SBOM candidate
        env:
          SBOM_FILE_PATH: ${{ steps.sbom-metadata.outputs.file_path }}
          SBOM_VERSION: ${{ steps.sbom-metadata.outputs.version }}
          TESTED_IMAGE: ${{ steps.image-smoke.outputs.image_id }}
        run: >-
          ./scripts/sbom-gate.sh
          "${TESTED_IMAGE}"
          "${SBOM_FILE_PATH}"
          "${REGISTRY}/${IMAGE_NAME,,}"
          "${SBOM_VERSION}"

      - name: Retain validated SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.sbom-metadata.outputs.artifact_name }}
          path: ${{ steps.sbom-metadata.outputs.file_path }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      # The tested candidate generates its own OpenAPI document
      # (docs/deployment.md, API Documentation Publication); a version-tag
      # build attaches it to the GitHub Release.
      - name: Extract OpenAPI document
        env:
          TESTED_IMAGE: ${{ steps.image-smoke.outputs.image_id }}
        run: ./scripts/extract-openapi.sh "${TESTED_IMAGE}" "${RUNNER_TEMP}/openapi/openapi.json"

      - name: Retain OpenAPI document
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.OPENAPI_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/openapi/openapi.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      # A published GitHub Release is final (docs/deployment.md, Release
      # Publication and Immutability). Checked immediately before the first
      # registry push so that no rerun can move the X.Y.Z tag of a published
      # release. Draft releases pass: a rerun may rebuild them.
      - name: Verify release is unpublished
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/check-release-unpublished.sh

      # Only reached if the smoke and SBOM gates passed. Publish the SAME local
      # image artifact by re-tagging it with each metadata-action tag and
      # pushing. No second docker/build-push-action build is performed, so
      # the published digest is identical to the tested one.
      #
      # IMAGE_TAGS is passed via env (not interpolated directly into the
      # script) to avoid shell-injection risk from untrusted ref/tag
      # content. set -euo pipefail ensures that a failed docker push
      # aborts the step immediately instead of being masked by a later
      # loop iteration's exit code. The here-string (<<<) avoids piping
      # into a subshell so set -e inside the loop body works as expected.
      - name: Push tested image (same digest)
        id: push
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          SMOKE_IMAGE: ${{ steps.image-smoke.outputs.image_id }}
        run: ./scripts/publish-image.sh

  publish-release-metadata:
    name: Publish Release Metadata
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Rerunning this job for an already published release must not add
      # attestations or touch its assets.
      - name: Verify release is unpublished
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/check-release-unpublished.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-backend.outputs.sbom-artifact-name }}
          path: ${{ runner.temp }}/release-sbom

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.OPENAPI_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/release-openapi

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build-backend.outputs.image-name }}
          subject-digest: ${{ needs.build-backend.outputs.image-digest }}
          sbom-path: ${{ runner.temp }}/release-sbom/${{ needs.build-backend.outputs.sbom-file-name }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest release build provenance
        id: attest-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build-backend.outputs.image-name }}
          subject-digest: ${{ needs.build-backend.outputs.image-digest }}
          push-to-registry: true
          create-storage-record: false

      # Last step: attaches the SBOM, both attestation bundles, and the
      # OpenAPI document to the draft release created by release-please, then
      # publishes it.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          SBOM_PATH: ${{ runner.temp }}/release-sbom/${{ needs.build-backend.outputs.sbom-file-name }}
          SBOM_BUNDLE_PATH: ${{ steps.attest-sbom.outputs.bundle-path }}
          PROVENANCE_BUNDLE_PATH: ${{ steps.attest-provenance.outputs.bundle-path }}
          OPENAPI_PATH: ${{ runner.temp }}/release-openapi/openapi.json
        run: ./scripts/publish-release.sh
