name: Scorecard Analysis

# Runs the official OpenSSF Scorecard action so this repository is
# discovered, scanned, and published to the public Scorecard dataset
# (https://scorecard.dev) and to GitHub's Code Scanning dashboard. See
# docs/deployment.md (CI Pipeline, Workflow Inventory) for this
# workflow's place in the overall pipeline.
#
# This workflow is non-blocking by design: it never fails a merge and
# never touches the publish path (build-images.yml). It follows the
# upstream example workflow from https://github.com/ossf/scorecard
# almost verbatim (trigger set, permission set, step sequence), since
# `publish_results: true` imposes strict Workflow Restrictions on the
# job running `ossf/scorecard-action` — see
# https://github.com/ossf/scorecard-action#workflow-restrictions: no
# job-level env vars or defaults, no containers or services, and only
# steps from an approved action allow-list (checkout, upload-artifact,
# codeql-action/upload-sarif, scorecard-action, harden-runner).
#
# Every action below is pinned by full commit SHA — the repository-wide
# default. See docs/deployment.md (Workflow Conventions, Pinned action
# references).

on:
  push:
    branches:
      - master
  schedule:
    # Weekly on Saturdays, matching the upstream default schedule.
    - cron: "30 1 * * 6"
  workflow_dispatch:

concurrency:
  group: scorecard
  cancel-in-progress: false

permissions: read-all

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required to upload results to Code Scanning.
      security-events: write
      # Required for the GitHub OIDC token used by publish_results.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # The Scorecard team runs a weekly scan of public GitHub
          # repositories (see https://github.com/ossf/scorecard#public-data).
          # Publishing our own results lets this repository's scan
          # come from this workflow instead of their infrastructure,
          # and is required to enable the README badge / scorecard.dev
          # listing.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
