name: Python Next

# Weekly, non-blocking run of the backend test suite against the next
# Python minor version (one above backend/.python-version). See
# docs/deployment.md (Python Forward-Compatibility Check) for the full
# rationale, and docs/conventions.md (Version Bump Checklist) for the
# manual bump procedure this workflow provides early warning for.
#
# This workflow reports forward-compatibility failures through its native
# Actions status and logs. It never touches build-images.yml or the publish
# path and is never a required/blocking status check.

on:
  schedule:
    # Every Monday at 07:00 UTC (one hour after image-scan.yml's 06:00
    # UTC run, to avoid runner contention).
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: python-forward-compat
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forward-compat:
    name: Test Against Next Python Version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel_test
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      TEST_REDIS_URL: redis://localhost:6379/2
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production-min-32-chars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute current and next Python minor version
        id: python-version
        run: |
          set -euo pipefail
          current=$(cat .python-version)
          major="${current%%.*}"
          minor="${current#*.}"
          next="${major}.$((minor + 1))"
          echo "current=${current}" >>"${GITHUB_OUTPUT}"
          echo "next=${next}" >>"${GITHUB_OUTPUT}"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.13"
          enable-cache: true

      # Guards against a false-positive forward-compatibility failure:
      # right after a Runtime Version bump, the next minor may have no
      # published build yet (no alpha/beta/rc available). That is not
      # an incompatibility signal — it just means there is nothing to
      # test yet. `--only-downloads` lists only installable builds, so
      # empty output means the version does not exist for this
      # platform/architecture.
      - name: Check next Python version is available for download
        id: availability
        run: |
          set -euo pipefail
          next="${{ steps.python-version.outputs.next }}"
          if uv python list "${next}" --only-downloads 2>/dev/null | grep -q .; then
            echo "available=true" >>"${GITHUB_OUTPUT}"
          else
            echo "::notice::Python ${next} has no published build yet — skipping this run."
            echo "available=false" >>"${GITHUB_OUTPUT}"
          fi

      # Any failure below (interpreter installation, dependency resolution,
      # or an actual test failure) fails the workflow so its native status
      # badge reflects the forward-compatibility result. Unlike ci.yml's
      # reproducible backend-test job, this run intentionally allows
      # re-resolution (`uv sync` without `--locked`) since the goal is to
      # surface breakage against a still-unreleased interpreter, and coverage
      # gating is not a concern here (no `--cov` flags).
      - name: Run test suite against next Python version
        if: steps.availability.outputs.available == 'true'
        run: |
          set -euo pipefail
          uv python install "${{ steps.python-version.outputs.next }}"
          uv sync --python "${{ steps.python-version.outputs.next }}"
          uv run --python "${{ steps.python-version.outputs.next }}" pytest -v
