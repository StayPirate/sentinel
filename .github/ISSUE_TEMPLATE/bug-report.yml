name: Bug Report
description: Report a bug or unexpected behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Thank you for reporting a bug. Please fill in the details below
        to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |-
        1. Send a POST request to /api/v1/...
        2. With the following payload: ...
        3. Observe the response ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Sentinel version
      description: >-
        The version of Sentinel where the bug occurs (e.g., 0.3.0).
        Check via `sentinel --version` or the `info.version` field of
        `/api/openapi.json`.
      placeholder: "0.3.0"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Any relevant environment details (OS, Python version, deployment
        method).
      placeholder: |-
        - OS: openSUSE Tumbleweed
        - Python: 3.14.x
        - Deployment: Docker / local dev
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >-
        Paste any relevant log output. This will be automatically
        formatted as code.
      render: text
    validations:
      required: false
