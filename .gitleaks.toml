# Gitleaks configuration for Sentinel.
#
# Used by the local pre-commit hook only (.githooks/pre-commit) — there
# is no CI job or GitHub Action for secret scanning, by design. See
# docs/features/platform/testing-strategy.md (Pre-Commit Hooks).
#
# This file extends gitleaks' built-in default rule set (it does not
# replace it). The default rule set does not flag the fictional or
# placeholder values used in tests, examples, or documentation
# (fictional bcrypt hashes, "not-for-production" markers, documentation
# placeholders). Each confirmed false positive of a non-secret value has
# a pattern-based (never path-based) [[allowlists]] table below, with a
# comment explaining why the value is not a secret — see
# https://github.com/gitleaks/gitleaks#configuration for the format.
title = "Sentinel gitleaks config"

[extend]
useDefault = true

# False positive: the default `generic-api-key` rule occasionally flags
# SQLAlchemy's `populate_existing=True` execution option/kwarg (used
# throughout `app/services/` and `tests/` to force a refresh from the
# database) due to its entropy. Confirmed safe — this is a well-known
# SQLAlchemy keyword argument, never a credential.
[[allowlists]]
description = "SQLAlchemy populate_existing kwarg (not a secret)"
regexes = ['''populate_existing=True''']

# False positive: the IBS API source-diff document's root carries a
# `key` attribute holding the 32-character hexadecimal key of the server's
# diff cache entry (backend/tests/fixtures/ibs/). It is a public
# cache identifier derived from the compared source states, never a
# credential, and Sentinel does not consume it.
[[allowlists]]
description = "IBS API sourcediff cache key attribute (not a secret)"
regexTarget = "line"
regexes = ['''<sourcediff key="[0-9a-f]{32}"''']
