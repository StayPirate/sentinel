[project]
name = "sentinel"
version = "0.10.2"
description = "Security update management platform for SUSE/openSUSE distributions"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [
    { name = "SUSE LLC" },
]
keywords = ["security", "cve", "vulnerability", "suse", "opensuse", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.141.1",
    # uvicorn's default "auto" event loop and HTTP implementations select
    # uvloop and httptools when they are installed. They are declared
    # directly instead of through the uvicorn[standard] extra, which also
    # installs websockets, PyYAML, and watchfiles that the runtime never
    # uses (watchfiles backs `uvicorn --reload` and is a dev dependency).
    "uvicorn>=0.52.3",
    "uvloop>=0.23.0; sys_platform != 'win32' and sys_platform != 'cygwin' and platform_python_implementation != 'PyPy'",
    "httptools>=0.9.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "asyncpg>=0.30.0",
    "alembic>=1.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.15.0",
    "celery[redis]>=5.6.3",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "bcrypt>=4.2.0",
    "PyJWT>=2.14.0",
    "cryptography>=50.0.2",
    "structlog>=26.1.0",
    "cvss>=3.6",
    "celery-redbeat>=2.4.2",
    "email-validator>=2.3.0",
    "click>=8.5.0",
    "aio-pika>=10.1.1",
    "aiormq>=7.2.2",
]

[project.scripts]
sentinel = "app.cli:main"

[project.urls]
Homepage = "https://github.com/StayPirate/sentinel"
Documentation = "https://github.com/StayPirate/sentinel/tree/master/docs"
Repository = "https://github.com/StayPirate/sentinel"
Issues = "https://github.com/StayPirate/sentinel/issues"
Changelog = "https://github.com/StayPirate/sentinel/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.3",
    "mypy>=2.4.0",
    "testcontainers>=4.15.0",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20261006",
    "watchfiles>=1.3.0",
    # Tests read workflow, Compose, and OpenCode YAML with a YAML 1.2
    # parser: a YAML 1.1 parser such as PyYAML reads the workflow `on:`
    # key as the boolean True and silently keeps the last duplicate key.
    "ruamel.yaml>=0.19.1",
]

# uv builds the project with the uv_build backend bundled in its own binary,
# without downloading a build backend, only while this range is compatible
# with the running uv version. Renovate moves it together with the uv version
# pinned in backend/Dockerfile (see docs/deployment.md, Container Build
# Conventions → uv image pinning).
[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "DTZ",   # flake8-datetimez (enforces UTC-aware datetimes)
    "ASYNC", # flake8-async (async pitfalls)
    "PT",    # flake8-pytest-style
    "RUF",   # ruff-specific rules
    "C4",    # flake8-comprehensions
    "LOG",   # flake8-logging
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # skip assert warnings (used in tests/app code)

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
enable_error_code = ["unused-awaitable", "ignore-without-code"]
# One worker process per CPU, at most 8; MYPY_NUM_WORKERS overrides it,
# e.g. 0 for a sequential run (see docs/conventions.md, Static Type
# Checking).
num_workers = "auto"

# Libraries without bundled type stubs or py.typed markers. Each entry
# MUST be revisited when the library gains type support, or when the
# feature area that depends on it moves from stub/interim implementation
# to full implementation — whichever comes first (see docs/conventions.md,
# Static Type Checking).
[[tool.mypy.overrides]]
module = [
    "celery.*",
    "cvss.*",
    "redbeat.*",
    "testcontainers.*",
    "xdist.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Exclude the OCI artifact suite and the local process system suite from
# a plain `uv run pytest`. The image suite requires a running container
# (started by scripts/image-smoke.sh) and runs as its own invocation; the
# system suite spawns real worker/Beat processes, so focused runs skip it,
# while the pre-push hook and CI include it in their parallel run with
# `-m "not image"` (see docs/features/platform/testing-strategy.md, Local
# Process System Testing).
# --strict-markers: an unregistered marker fails the run instead of
# emitting a silent warning.
# --strict-config: an unrecognized ini option fails the run instead of
# being silently ignored.
addopts = "-m 'not image and not system' --strict-markers --strict-config"
markers = [
    "unit: Fast, isolated tests (no DB, no Redis, no network)",
    "integration: Tests with real PostgreSQL",
    "e2e: Full HTTP request/response cycle tests",
    "image: OCI artifact and publication-gate tests (require Docker Engine and Docker Compose; excluded from default run)",
    "system: Local process system tests (spawn worker/Beat; excluded from default run)",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["app"]
branch = true
# "greenlet": SQLAlchemy's async engine (and every async ORM/Core call,
# not just run_sync()) bridges to the underlying sync driver via
# greenlet internally. "thread": FastAPI/anyio run synchronous
# dependencies and endpoint functions in a real OS thread pool
# (anyio.to_thread), and app/services/local_auth_service.py offloads
# bcrypt work via asyncio.to_thread(). Without both entries, coverage.py
# loses track of statements executed after control passes through a
# greenlet switch or into a spawned thread, silently under-reporting
# coverage (see docs/features/platform/testing-strategy.md, Coverage
# Configuration).
concurrency = ["greenlet", "thread"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "app/database.py",
]

[tool.coverage.report]
fail_under = 95
