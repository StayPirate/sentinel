[project]
name = "sentinel"
version = "0.5.1"
description = "Security update management platform for SUSE/openSUSE distributions"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [
    { name = "SUSE LLC" },
]
keywords = ["security", "cve", "vulnerability", "suse", "opensuse", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.30.0",
    "alembic>=1.19.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.15.0",
    "celery[redis]>=5.6.3",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "bcrypt>=4.2.0",
    "PyJWT[crypto]>=2.8.0",
    "python-multipart>=0.0.12",
    "structlog>=26.1.0",
    "cvss>=3.6",
    "celery-redbeat>=2.4.2",
    "email-validator>=2.3.0",
    "click>=8.1.0",
]

[project.scripts]
sentinel = "app.cli:main"

[project.urls]
Homepage = "https://github.com/StayPirate/sentinel"
Documentation = "https://github.com/StayPirate/sentinel/tree/master/docs"
Repository = "https://github.com/StayPirate/sentinel"
Issues = "https://github.com/StayPirate/sentinel/issues"
Changelog = "https://github.com/StayPirate/sentinel/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.16.3",
    "mypy>=1.14.0",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.audit]
# Check locked dependencies against the OpenSSF malicious-packages
# database (via OSV) on every `uv sync`/`uv lock`. Complements
# pip-audit (known CVEs) with a supply-chain malware detection layer
# (typosquatting, compromised maintainer accounts, injected payloads).
malware-check = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "DTZ",   # flake8-datetimez (enforces UTC-aware datetimes)
    "ASYNC", # flake8-async (async pitfalls)
    "PT",    # flake8-pytest-style
    "RUF",   # ruff-specific rules
    "C4",    # flake8-comprehensions
    "LOG",   # flake8-logging
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # skip assert warnings (used in tests/app code)

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
enable_error_code = ["unused-awaitable", "ignore-without-code"]

# Libraries without bundled type stubs or py.typed markers. Each entry
# MUST be revisited when the library gains type support, or when the
# feature area that depends on it moves from stub/interim implementation
# to full implementation — whichever comes first (see docs/conventions.md,
# Static Type Checking).
[[tool.mypy.overrides]]
module = [
    "celery.*",
    "redbeat.*",
    "testcontainers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Exclude the OCI artifact suite and the local process system suite from
# the default run. The image suite requires a running container (started
# by scripts/image-smoke.sh); the system suite spawns
# real worker/Beat processes (see docs/features/platform/testing-strategy.md,
# Local Process System Testing). Neither must be pulled into
# `uv run pytest` or the coverage measurement — both run as separate,
# dedicated invocations (pre-push hook, CI).
# --strict-markers: an unregistered marker fails the run instead of
# emitting a silent warning.
# --strict-config: an unrecognized ini option fails the run instead of
# being silently ignored.
addopts = "-m 'not image and not system' --strict-markers --strict-config"
markers = [
    "unit: Fast, isolated tests (no DB, no Redis, no network)",
    "integration: Tests with real PostgreSQL",
    "e2e: Full HTTP request/response cycle tests",
    "image: OCI artifact and publication-gate tests (require Docker Engine and Docker Compose; excluded from default run)",
    "system: Local process system tests (spawn worker/Beat; excluded from default run)",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["app"]
branch = true
# "greenlet": SQLAlchemy's async engine (and every async ORM/Core call,
# not just run_sync()) bridges to the underlying sync driver via
# greenlet internally. "thread": FastAPI/anyio run synchronous
# dependencies and endpoint functions in a real OS thread pool
# (anyio.to_thread), and app/services/local_auth_service.py offloads
# bcrypt work via asyncio.to_thread(). Without both entries, coverage.py
# loses track of statements executed after control passes through a
# greenlet switch or into a spawned thread, silently under-reporting
# coverage (see docs/features/platform/testing-strategy.md, Coverage
# Configuration).
concurrency = ["greenlet", "thread"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "app/database.py",
]

[tool.coverage.report]
fail_under = 95
